name: Update IPTV playlists

on:
  workflow_dispatch:
  schedule:
    # Every 8 hours (UTC): 00:17, 08:17, 16:17
    - cron: "17 */8 * * *"

permissions:
  contents: write

concurrency:
  group: update-iptv-playlists
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download playlists
        shell: bash
        run: |
          set -euo pipefail

          temp_dir="$(mktemp -d)"
          trap 'rm -rf "$temp_dir"' EXIT

          curl \
            --fail \
            --location \
            --retry 5 \
            --retry-delay 10 \
            --retry-all-errors \
            --connect-timeout 20 \
            --max-time 300 \
            --output "$temp_dir/iptv4.txt" \
            "http://103.236.77.86:35455/iptv4.txt"

          curl \
            --fail \
            --location \
            --retry 5 \
            --retry-delay 10 \
            --retry-all-errors \
            --connect-timeout 20 \
            --max-time 300 \
            --output "$temp_dir/iptv4.m3u" \
            "http://103.236.77.86:35455/iptv4.m3u"

          test -s "$temp_dir/iptv4.txt"
          test -s "$temp_dir/iptv4.m3u"

          cp "$temp_dir/iptv4.txt" iptv.txt
          cp "$temp_dir/iptv4.txt" iptv4.txt
          cp "$temp_dir/iptv4.m3u" iptv4.m3u

      - name: Commit changed files
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add iptv.txt iptv4.txt iptv4.m3u

          if git diff --cached --quiet; then
            echo "No playlist changes."
            exit 0
          fi

          git commit -m "chore: update IPTV playlists"
          git push
