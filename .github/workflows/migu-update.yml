name: Migu M3U Update

on:
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: migu_video

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: migu_video/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Migu M3U
        run: node export_m3u.js

      - name: Show result
        run: |
          echo "===== M3U result ====="
          ls -lh migu.m3u migu.txt
          echo "======================"

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add migu.m3u migu.txt

          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Update Migu M3U"
            git push
          fi
